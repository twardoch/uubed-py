site_name: uubed
site_description: Position-safe QuadB64 embedding encoding for Python
site_author: Adam Twardoch
repo_url: https://github.com/twardoch/uubed
repo_name: twardoch/uubed

docs_dir: md
site_dir: ../docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference: api.md
  - Performance: performance.md
  - Integrations: integrations.md
  - Style Guide: STYLE_GUIDE.md
